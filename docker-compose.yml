services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: cineight
      POSTGRES_USER: cineight
      POSTGRES_PASSWORD: cineight
    ports: ["5432:5432"]
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cineight"]
      interval: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    # Ex: avisa cuando vence una clave (TTL). La API lo usa para difundir por SSE las butacas liberadas.
    command: ["redis-server", "--notify-keyspace-events", "Ex"]
    ports: ["6379:6379"]

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://cineight:cineight@postgres:5432/cineight
      REDIS_ADDR: redis:6379
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      # reCAPTCHA v3: clave secreta (vacía = verificación desactivada) y puntaje mínimo aceptado.
      RECAPTCHA_SECRET: ${RECAPTCHA_SECRET:-}
      RECAPTCHA_MIN_SCORE: ${RECAPTCHA_MIN_SCORE:-0.5}
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
