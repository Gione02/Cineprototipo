# Entorno local: PostgreSQL + Redis + API. Las credenciales salen del archivo .env de esta carpeta
# (no se sube a git); los valores tras ":-" son sólo para desarrollo en tu computadora.
# Los límites de CPU y memoria evitan que un contenedor acapare la máquina (hallazgo HAL-025).
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cineight}
      POSTGRES_USER: ${POSTGRES_USER:-cineight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cineight}
    ports: ["5432:5432"]
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cineight}"]
      interval: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 1024M

  redis:
    image: redis:8-alpine
    # Ex: avisa cuando vence una clave (TTL). La API lo usa para difundir por SSE las butacas liberadas.
    # maxmemory queda por debajo del límite del contenedor; noeviction: si se llena, Redis rechaza escrituras
    # (la API responde 503) en lugar de borrar candados de butacas o turnos de la cola para hacer espacio.
    command: ["redis-server", "--notify-keyspace-events", "Ex", "--maxmemory", "200mb", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  api:
    build: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-cineight}
      DB_USER: ${POSTGRES_USER:-cineight}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cineight}
      DB_SSLMODE: disable
      DB_MAX_CONNS: ${DB_MAX_CONNS:-25}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-5}
      REDIS_ADDR: redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # reCAPTCHA v3: clave secreta (vacía = verificación desactivada) y puntaje mínimo aceptado.
      RECAPTCHA_SECRET: ${RECAPTCHA_SECRET:-}
      RECAPTCHA_MIN_SCORE: ${RECAPTCHA_MIN_SCORE:-0.5}
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 512M
